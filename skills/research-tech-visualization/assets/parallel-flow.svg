<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" role="img" aria-labelledby="parallel-title parallel-desc"><title id="parallel-title">并行与合流骨架</title><desc id="parallel-desc">合成流程。任务分发同时启动执行者 A 与 B，合流等待两路均完成。两个泳道代表不同执行者，不表示相等耗时。</desc><defs><marker id="parallel-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#215ca0"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#172b42;font-size:18px}.small{font-size:15px;fill:#506279}.edge{fill:none;stroke:#215ca0;stroke-width:2;marker-end:url(#parallel-arrow)}</style><rect width="1040" height="600" fill="#fff"/><text x="40" y="48" font-size="28" font-weight="700">并行不是选择，合流条件要明确</text><text x="40" y="82" class="small">合成示例 · 两路同时启动 · 汇合等待全部完成 · 布局不表示耗时</text>
<rect id="parallel-lane-a" data-viz-node="container" x="350" y="120" width="300" height="170" rx="12" fill="#f5f8fc" stroke="#b5c5d8"/><text data-viz-owner="parallel-lane-a" x="375" y="155" class="small">执行者 A</text><rect id="parallel-lane-b" data-viz-node="container" x="350" y="340" width="300" height="170" rx="12" fill="#f5f8fc" stroke="#b5c5d8"/><text data-viz-owner="parallel-lane-b" x="375" y="375" class="small">执行者 B</text>
<rect id="parallel-fork" data-viz-node="component" x="40" y="280" width="170" height="90" rx="10" fill="#eaf1fa" stroke="#215ca0"/><text data-viz-owner="parallel-fork" x="64" y="316">并行分发</text><text data-viz-owner="parallel-fork" x="64" y="348" class="small">两路均启动</text>
<rect id="parallel-a" data-viz-node="component" data-viz-parent="parallel-lane-a" x="400" y="180" width="180" height="70" rx="10" fill="#fff" stroke="#215ca0"/><text data-viz-owner="parallel-a" x="426" y="222">处理任务 A</text><rect id="parallel-b" data-viz-node="component" data-viz-parent="parallel-lane-b" x="400" y="400" width="180" height="70" rx="10" fill="#fff" stroke="#215ca0"/><text data-viz-owner="parallel-b" x="426" y="442">处理任务 B</text>
<rect id="parallel-join" data-viz-node="component" x="800" y="280" width="200" height="90" rx="10" fill="#edf6f3" stroke="#147568"/><text data-viz-owner="parallel-join" x="824" y="316">结果合流</text><text data-viz-owner="parallel-join" x="824" y="348" class="small">等待两路均完成</text>
<polyline class="edge" data-viz-from="parallel-fork" data-viz-to="parallel-a" data-viz-kind="parallel-start" points="210,300 300,300 300,215 400,215"/><polyline class="edge" data-viz-from="parallel-fork" data-viz-to="parallel-b" data-viz-kind="parallel-start" points="210,350 300,350 300,435 400,435"/><polyline class="edge" data-viz-from="parallel-a" data-viz-to="parallel-join" data-viz-kind="join-all" points="580,215 700,215 700,300 800,300"/><polyline class="edge" data-viz-from="parallel-b" data-viz-to="parallel-join" data-viz-kind="join-all" points="580,435 700,435 700,350 800,350"/>
<text x="670" y="188" class="small">A 完成</text><text x="670" y="467" class="small">B 完成</text><text x="40" y="565" class="small">来源：并行结构演示；真实任务需核实取消、失败、超时与部分成功时的合流规则。</text></svg>
