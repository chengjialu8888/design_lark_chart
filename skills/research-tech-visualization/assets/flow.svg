<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" role="img" aria-labelledby="flow-title flow-desc">
  <title id="flow-title">流程骨架：核对、通过与补充</title>
  <desc id="flow-desc">合成流程示例。接收输入后执行核对；资料充分时交付，资料不足时请求补充并回到核对。不是并行流程或运行日志。</desc>
  <defs><marker id="flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#215ca0"/></marker></defs>
  <style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#172b42;font-size:18px}.small{font-size:15px;fill:#506279}.heading{font-size:28px;font-weight:700}.edge{fill:none;stroke:#215ca0;stroke-width:2.5;marker-end:url(#flow-arrow)}</style>
  <rect width="1040" height="560" fill="#fff"/>
  <text x="40" y="48" class="heading">把条件写在线上，把回路画完整</text>
  <text x="40" y="80" class="small">合成示例 · 矩形条件检查，不强制使用菱形 · 顺序与条件不是部署关系</text>
  <rect id="flow-input" data-viz-node="component" x="50" y="190" width="210" height="100" rx="12" fill="#eaf1fa" stroke="#215ca0"/>
  <text data-viz-owner="flow-input" x="78" y="232">01 接收输入</text>
  <text data-viz-owner="flow-input" x="78" y="263" class="small">记录来源与版本</text>
  <rect id="flow-check" data-viz-node="component" x="420" y="190" width="210" height="100" rx="12" fill="#fff5da" stroke="#997126"/>
  <text data-viz-owner="flow-check" x="448" y="232">02 核对材料</text>
  <text data-viz-owner="flow-check" x="448" y="263" class="small">当前信息是否充分？</text>
  <rect id="flow-output" data-viz-node="component" x="790" y="190" width="210" height="100" rx="12" fill="#edf6f3" stroke="#147568"/>
  <text data-viz-owner="flow-output" x="818" y="232">03 交付结果</text>
  <text data-viz-owner="flow-output" x="818" y="263" class="small">说明边界与未验项</text>
  <rect id="flow-revise" data-viz-node="component" x="420" y="390" width="210" height="80" rx="12" fill="#fff" stroke="#7b8797"/>
  <text data-viz-owner="flow-revise" x="448" y="437">补充或确认缺口</text>
  <line class="edge" data-viz-from="flow-input" data-viz-to="flow-check" data-viz-kind="sequence" x1="260" y1="240" x2="420" y2="240"/>
  <text x="298" y="217" class="small">材料就绪</text>
  <line class="edge" data-viz-from="flow-check" data-viz-to="flow-output" data-viz-kind="condition" x1="630" y1="240" x2="790" y2="240"/>
  <text x="672" y="217" class="small">是：充分</text>
  <line class="edge" data-viz-from="flow-check" data-viz-to="flow-revise" data-viz-kind="condition" x1="525" y1="290" x2="525" y2="390"/>
  <text x="546" y="346" class="small">否：缺少必要证据</text>
  <polyline class="edge" data-viz-from="flow-revise" data-viz-to="flow-check" data-viz-kind="return" points="420,430 340,430 340,340 460,340 460,290" stroke-dasharray="6 5"/>
  <text x="160" y="417" class="small">补充后重新核对</text>
  <text x="40" y="532" class="small">来源：骨架演示；重用时根据真实流程替换分支条件、返回点与终止条件。</text>
</svg>
