<style>
  #style-module {display:grid;gap:10px;color:var(--foreground);--node-shadow:0 1px 2px #18243b08,0 3px 9px #18243b08;--node-accent:var(--viz-series-1)}

  #style-module .actor-port[data-side="right"] {right:-2px;top:calc(50% - 3px)}
  #style-module .actor-port[data-side="top"] {top:-2px;left:calc(50% - 3px)}
  #style-module .actor-port[data-side="bottom"] {bottom:-2px;left:calc(50% - 3px)}
  #style-module .scene-actor[data-state="active"] .actor-mark,#style-module .scene-actor[data-state="waiting"] .actor-mark,#style-module .scene-actor[data-state="done"] .actor-mark {color:var(--node-accent)}

  #style-module .scene-actor[data-kind="person"] .actor-mark {color:var(--node-accent)}

<style>
  #style-sequence {display:grid;gap:10px;color:var(--foreground);--node-shadow:0 1px 2px #18243b08,0 3px 9px #18243b08;--node-accent:var(--viz-series-1)}
  #style-sequence header {display:flex;align-items:baseline;justify-content:space-between;gap:16px}
  #style-sequence .scene-provenance {position:relative;flex-shrink:0;font-size:11px;color:var(--muted-foreground)}
  #style-sequence .scene-provenance summary {cursor:pointer;list-style:none;padding:4px 0}
  #style-sequence .scene-provenance summary::-webkit-details-marker {display:none}
  #style-sequence .scene-provenance[open] span {position:absolute;right:0;top:28px;width:min(320px,70vw);padding:12px 14px;border:1px solid var(--border);background:var(--background);border-radius:10px;box-shadow:var(--node-shadow);z-index:30}
  #style-sequence .scene-nav {display:flex;flex-wrap:wrap;gap:6px}
  #style-sequence .scene-heading,#style-sequence .scene-controls {display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
  #style-sequence .scene-heading {padding:2px 1px}
  #style-sequence .scene-heading h3 {color:var(--muted-foreground)}
  #style-sequence .scene-heading [data-count] {font-size:10px;letter-spacing:.05em}
  #style-sequence .scene-stage {position:relative;width:100%;transition:height .65s cubic-bezier(.22,1,.36,1);isolation:isolate;border-radius:16px;background:var(--canvas,var(--muted));outline:1px solid var(--border);box-shadow:inset 0 1px 0 var(--background)}
  #style-sequence .scene-stage::before {content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;background-image:radial-gradient(circle,var(--border) .75px,transparent .85px);background-size:16px 16px;opacity:.65;mask-image:linear-gradient(180deg,transparent,#000 12%,#000 88%,transparent)}
  #style-sequence .scene-stage:hover>.playback-float {opacity:.85;transform:none}
  #style-sequence .scene-links,#style-sequence .scene-actors {position:absolute;inset:0;width:100%;height:100%}
  #style-sequence .scene-canvas {position:absolute;inset:0;transform-origin:top left}
  #style-sequence .scene-links {overflow:visible;pointer-events:none;z-index:1}
  #style-sequence .scene-actor {position:absolute;top:0;left:0;box-sizing:border-box;opacity:0;transform:translate(0,0);transition:transform var(--scene-duration,.55s) var(--scene-easing,cubic-bezier(.22,1,.36,1)),width var(--scene-duration,.55s) var(--scene-easing,cubic-bezier(.22,1,.36,1)),height var(--scene-duration,.55s) var(--scene-easing,cubic-bezier(.22,1,.36,1)),opacity .25s;display:flex;flex-direction:column;justify-content:center;gap:4px;padding:10px;pointer-events:auto;font-size:13px;line-height:18px;border-radius:8px}
  #style-sequence .scene-actor[aria-hidden="true"] {pointer-events:none}
  #style-sequence .scene-actor:hover .actor-shape {stroke:color-mix(in srgb,var(--node-accent) 55%,var(--border))}
  #style-sequence .scene-actor:hover .actor-surface {filter:drop-shadow(0 2px 3px #18243b12)}
  #style-sequence .actor-surface {position:absolute;inset:0;width:100%;height:100%;z-index:-1;overflow:visible}
  #style-sequence .actor-surface {filter:drop-shadow(0 1px 1px #18243b09);transition:filter .25s}
  #style-sequence .actor-shape {fill:var(--background);stroke:var(--border);stroke-width:1;transition:fill .3s,stroke .3s}
  #style-sequence .scene-actor[data-state="active"] .actor-shape {fill:var(--background);stroke:color-mix(in srgb,var(--node-accent) 80%,var(--border));stroke-width:1}
  #style-sequence .scene-actor[data-state="active"]:not([data-container="true"]) {box-shadow:0 0 0 2px color-mix(in srgb,var(--node-accent) 9%,transparent)}
  #style-sequence .scene-actor[data-state="waiting"] {--node-accent:var(--orange)}
  #style-sequence .scene-actor[data-state="waiting"] .actor-shape {fill:color-mix(in srgb,var(--orange) 4%,var(--background));stroke:color-mix(in srgb,var(--orange) 55%,var(--border))}
  #style-sequence .scene-actor[data-container="true"] {justify-content:flex-start;padding:10px;pointer-events:none;box-shadow:none}
  #style-sequence .scene-actor[data-container="true"] .actor-surface {filter:none}
  #style-sequence .scene-actor[data-container="true"] .actor-shape {fill:color-mix(in srgb,var(--background) 55%,transparent);stroke:color-mix(in srgb,var(--border) 85%,transparent);stroke-dasharray:2 5}
  #style-sequence .scene-actor[data-container="true"] .actor-top {color:var(--muted-foreground);font-weight:400}
  #style-sequence .scene-actor[data-state="done"] {--node-accent:var(--green)}
  #style-sequence .scene-actor[data-state="done"] .actor-shape {fill:var(--background);stroke:color-mix(in srgb,var(--green) 28%,var(--border))}
  #style-sequence .scene-actor[data-muted="true"] .actor-shape {fill:var(--canvas,var(--muted));stroke:color-mix(in srgb,var(--border) 65%,transparent)}
  #style-sequence .scene-actor[data-muted="true"] .actor-top {color:var(--muted-foreground)}
  #style-sequence .actor-top {display:flex;align-items:center;gap:7px;font-weight:400;overflow-wrap:anywhere;min-width:0;line-height:18px;padding-right:8px}
  #style-sequence .actor-title {min-width:0;flex:1}
  #style-sequence .actor-mark {width:22px;height:22px;color:var(--muted-foreground);flex-shrink:0;display:grid;place-items:center;background:var(--muted);border:1px solid color-mix(in srgb,var(--border) 65%,transparent);border-radius:5px}
  #style-sequence .actor-icon {width:14px;height:14px;overflow:visible}
  #style-sequence .scene-actor[data-kind="person"] .actor-mark {border-radius:50%}
  #style-sequence .scene-actor[data-kind="message"] .actor-mark,#style-sequence .scene-actor[data-state="active"] .actor-mark {background:color-mix(in srgb,var(--node-accent) 8%,var(--background));border-color:color-mix(in srgb,var(--node-accent) 16%,var(--border))}
  #style-sequence .scene-actor[data-container="true"] .actor-mark {width:16px;height:18px;background:none;border:0}
  #style-sequence .actor-state {position:absolute;right:8px;top:8px;width:4px;height:4px;border-radius:50%;background:var(--border)}
  #style-sequence .scene-actor[data-state="active"] .actor-state,#style-sequence .scene-actor[data-state="waiting"] .actor-state,#style-sequence .scene-actor[data-state="done"] .actor-state {background:var(--node-accent)}
  #style-sequence .scene-actor[data-container="true"] .actor-state {display:none}
  #style-sequence .actor-port {position:absolute;width:6px;height:6px;border:1px solid var(--muted-foreground);border-radius:50%;background:var(--background);pointer-events:none;z-index:3}
  #style-sequence .actor-port[hidden] {display:none}
  #style-sequence .actor-port[data-kind="call"],#style-sequence .actor-port[data-kind="return"] {--port-color:var(--green)}
  #style-sequence .actor-port[data-state="flow"] {border-color:var(--port-color,var(--node-accent));background:var(--port-color,var(--node-accent));box-shadow:0 0 0 2px var(--background)}
  #style-sequence .actor-port[data-state="waiting"] {border-color:var(--orange)}
  #style-sequence .actor-port[data-side="left"] {left:-2px;top:calc(50% - 3px)}
  #style-sequence .actor-port[data-side="right"] {right:-2px;top:calc(50% - 3px)}
  #style-sequence .actor-port[data-side="top"] {top:-2px;left:calc(50% - 3px)}
  #style-sequence .actor-port[data-side="bottom"] {bottom:-2px;left:calc(50% - 3px)}
  #style-sequence .scene-actor[data-state="active"] .actor-mark,#style-sequence .scene-actor[data-state="waiting"] .actor-mark,#style-sequence .scene-actor[data-state="done"] .actor-mark {color:var(--node-accent)}
  #style-sequence .actor-lines {display:grid;gap:2px;overflow-wrap:anywhere;font-size:11px;line-height:15px;padding-top:5px;border-top:1px solid var(--border)}
  #style-sequence .actor-lines:empty {display:none}
  #style-sequence .scene-actor[data-density="micro"] .actor-mark {display:none}
  #style-sequence .scene-actor[data-density="micro"] .actor-lines {padding-left:0}
  #style-sequence .scene-actor[data-density="micro"] .actor-lines {padding-top:0;border-top:0}
  #style-sequence .actor-line {transition:opacity .2s,transform .35s}
  #style-sequence .actor-line.enter {animation:style-sequence-line .4s both}
  #style-sequence .scene-actor[data-kind="terminal"] {padding-top:10px}
  #style-sequence .scene-actor[data-kind="terminal"] .actor-shape {fill:color-mix(in srgb,var(--foreground) 4%,var(--background))}
  #style-sequence .scene-actor[data-kind="terminal"] .actor-lines {font-family:ui-monospace,SFMono-Regular,monospace;color:var(--foreground)}
  #style-sequence .scene-actor[data-kind="document"] {padding-top:10px}
  #style-sequence .scene-actor[data-kind="person"] .actor-shape {fill:var(--background);stroke:var(--border)}
  #style-sequence .scene-actor[data-kind="person"] .actor-mark {color:var(--node-accent)}
  #style-sequence .scene-actor[data-kind="message"] .actor-mark {color:var(--node-accent)}
  #style-sequence .scene-actor[data-kind="message"] .actor-shape {fill:var(--background)}
  #style-sequence .scene-actor[data-kind="message"] .actor-lines {color:var(--foreground)}

  let selected='compact',blobURL;

    if(!Object.hasOwn(examples,id))return;

    buttons.forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.style===id)));
    document.querySelectorAll('main>section[data-example]').forEach(section=>{
      if(section.id!==id&&!section.hidden){

    });

    status.textContent='';
    if(blobURL){URL.revokeObjectURL(blobURL);blobURL=undefined;}
    download.removeAttribute('href');
    window.dispatchEvent(new Event('resize'));
  }
  buttons.forEach(button=>button.onclick=()=>choose(button.dataset.style));
  document.getElementById('adopt-style').onclick=()=>{
    request.value=`请用 architecture-story 的「${labels[selected]}」绘制当前需求，并在故事 JSON 中保存 presentation.style: "${selected}"。按该风格示例组织节点、图例、箭头和边框。`;
    if(blobURL)URL.revokeObjectURL(blobURL);
    blobURL=URL.createObjectURL(new Blob([JSON.stringify(examples[selected],null,2)+'\n'],{type:'application/json'}));
    download.href=blobURL;
    download.download=`architecture-story-${selected}.json`;
    adoption.hidden=false;
    status.textContent=`已选择${labels[selected]}。复制指令发给助手，或下载示例 JSON。`;
    request.focus();
    request.select();
  };
  document.getElementById('copy-request').onclick=async()=>{
    try{
      await navigator.clipboard.writeText(request.value);
      status.textContent='指令已复制，可粘贴到会话中。';
    }catch{
      request.focus();request.select();
      status.textContent='请复制已选中的指令，再粘贴到会话中。';
    }
  };
})();
</script></html>
